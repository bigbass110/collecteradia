name: Vérifications

on: [push, pull_request]

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collecte-dictees   # le projet est dans ce sous-dossier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt pytest jiwer
      - name: Convention d'écriture de phrases.csv
        run: python scripts/verifier_phrases.py
      - name: Tests
        run: pytest -q
